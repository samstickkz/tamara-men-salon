<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-label="Tamara Men Salon">
  <!-- Barber pole emblem (left of wordmark) -->
  <g transform="translate(20,40)">
    <!-- Scissors mark -->
    <g fill="none" stroke="#B89758" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="30" cy="100" r="14"/>
      <circle cx="30" cy="40" r="14"/>
      <line x1="42" y1="50" x2="135" y2="118"/>
      <line x1="42" y1="90" x2="135" y2="22"/>
      <line x1="135" y1="118" x2="150" y2="128"/>
      <line x1="135" y1="22" x2="150" y2="12"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g font-family="'Playfair Display', 'Cormorant Garamond', Georgia, serif">
    <text x="200" y="110" font-size="72" font-weight="700" fill="#161412" letter-spacing="2">Tamara</text>
    <text x="200" y="170" font-size="28" font-weight="500" fill="#B89758" letter-spacing="12" font-family="'Oswald', 'Bebas Neue', Impact, sans-serif">MEN SALON</text>
  </g>

  <!-- Underline rule with diamond -->
  <g transform="translate(200,180)">
    <line x1="0" y1="0" x2="320" y2="0" stroke="#B89758" stroke-width="1.5"/>
    <rect x="155" y="-5" width="10" height="10" fill="#FBF8F1" stroke="#B89758" stroke-width="1.5" transform="rotate(45 160 0)"/>
  </g>
</svg>
